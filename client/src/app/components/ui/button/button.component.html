@if (buttonType() === 'nav-panel-btn') {
    <button [class]="buttonType()">
        {{ label() }}
    </button>
} @else {
    <button [class]="[buttonType(), color()]">
        @if (icon()) {
            <span nz-icon [nzType]="icon()" nzTheme="outline"></span>
        } @else {
            {{ label() }}
        }
    </button>
}
