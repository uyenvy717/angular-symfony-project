<h1 class="text-2xl font-bold mb-4">Partner Dashboard</h1>
<div class="inside-dashboard grid gap-8 gap-y-10 max-h-full">
  <div class="statistic">
    <app-card [showContent]="true" [partnerData]="partnerData"></app-card>
  </div>
  <div class="list tabs-container">
    <nz-tabset>
      <nz-tab nzTitle="Clients">
        <app-client [partnerId]="partnerData?.id"></app-client>
      </nz-tab>
      <nz-tab nzTitle="Users">
        <app-user [partnerId]="partnerData?.id"></app-user>
      </nz-tab>
    </nz-tabset>
  </div>
</div>
