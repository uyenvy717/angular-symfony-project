<h1 class="text-2xl font-bold mb-4">Partner</h1>
<div class="partner-container">
  <nz-tabset (nzSelectedIndexChange)="onTabChange($event)">
    <!-- Growth Partner Tab - Only show for super admin -->
    <nz-tab *ngIf="isSuperAdmin" nzTitle="Growth Partner">
      <div *ngIf="loading" class="loading-container">
        <nz-spin nzSimple [nzSpinning]="true"></nz-spin>
      </div>
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>
      <div *ngIf="!loading && !error">
        <app-table [data]="partners"></app-table>
      </div>
    </nz-tab>

    <!-- Solution Partner Tab -->
    <nz-tab nzTitle="Solution Partner">
      <div *ngIf="loading" class="loading-container">
        <nz-spin nzSimple [nzSpinning]="true"></nz-spin>
      </div>
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>
      <div *ngIf="!loading && !error">
        <app-table [data]="partners"></app-table>
      </div>
    </nz-tab>

    <!-- Solution Provider Tab -->
    <nz-tab nzTitle="Solution Provider">
      <div *ngIf="loading" class="loading-container">
        <nz-spin nzSimple [nzSpinning]="true"></nz-spin>
      </div>
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>
      <div *ngIf="!loading && !error">
        <app-table [data]="partners"></app-table>
      </div>
    </nz-tab>

    <!-- Affiliate Partner Tab -->
    <nz-tab nzTitle="Affiliate Partner">
      <div *ngIf="loading" class="loading-container">
        <nz-spin nzSimple [nzSpinning]="true"></nz-spin>
      </div>
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>
      <div *ngIf="!loading && !error">
        <app-table [data]="partners"></app-table>
      </div>
    </nz-tab>
  </nz-tabset>
</div>

<ng-template #totalTemplate let-total>
  Total {{ total }} items
</ng-template>
