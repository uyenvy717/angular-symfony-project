<h1 class="text-2xl font-bold mb-4">User</h1>
<div class="user-container">
  @if (error(); as error) {
    <div class="error-message">
      {{ error }}
    </div>
  } @else if (loading()) {
    <div class="loading-container">
      <nz-spin nzSimple [nzSpinning]="true"></nz-spin>
    </div>
  } @else {
    <app-table [data]="users()" [columns]="columns" (rowClick)="onRowClick($event)" [showToggleButton]="true"></app-table>
  }
</div>
