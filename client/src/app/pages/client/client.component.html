<div class="flex flex-row justify-between">
  <h1 class="text-2xl font-bold mb-4">Client</h1>
  @if (authService.isSuperAdmin()) {
    <app-button [color]="'gold'" [label]="'+ Create Client'" (click)="openCreateModal()"></app-button>
  }
</div>
<div class="client-container">
  @if (error(); as error) {
    <div class="error-message">
      {{ error }}
    </div>
  } @else if (loading()) {
    <div class="loading-container">
      <nz-spin nzSimple [nzSpinning]="true"></nz-spin>
    </div>
  } @else {
    <app-table 
      [data]="clients()" 
      [columns]="columns"
      [canManage]="canManageClients()"
      (handleEdit)="openEditModal($event)"
      (rowClick)="onRowClick($event)">
    </app-table>
  }
</div>

<nz-modal 
  [nzVisible]="isModalVisible()"
  [nzTitle]="modalMode() === 'create' ? 'Create a new client' : 'Edit the client'"
  [nzFooter]="null"
  (nzOnCancel)="closeModal()"
  [nzWidth]="520"
>
  <ng-container *nzModalContent>
    <app-form
      [formGroup]="createForm"
      [onSubmit]="submitForm"
      [fields]="formFields()"
      [submitButtonText]="modalMode() === 'create' ? 'Create' : 'Save'"
    ></app-form>
  </ng-container>
</nz-modal>
